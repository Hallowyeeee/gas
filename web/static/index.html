<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瓦斯行管理系統</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2328; --muted:#656d76; --accent:#d9480f; --ok:#2b8a3e; --bad:#c92a2a; --line:#d0d7de; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --accent:#ff8c42; --ok:#3fb950; --bad:#f85149; --line:#30363d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; background:var(--bg); color:var(--text); font-size:17px; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:24px; margin:8px 0 20px; }
  h1 span { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .card h2 { font-size:18px; margin:0 0 12px; }
  label { display:block; margin:10px 0 4px; color:var(--muted); font-size:15px; }
  input { width:100%; padding:12px; font-size:17px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  button { margin-top:14px; padding:12px 18px; font-size:17px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .muted { color:var(--muted); font-size:15px; }
  .err { color:var(--bad); margin-top:10px; min-height:1em; }
  .ok { color:var(--ok); }
  .url { font-size:18px; word-break:break-all; font-weight:600; }
  #qr { margin-top:12px; background:#fff; display:inline-block; padding:8px; border-radius:8px; }
  #qr:empty { display:none; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>🔥 瓦斯行<span>管理系統</span></h1>

  <section class="card" id="setup" hidden>
    <h2>第一次使用：建立老闆帳號</h2>
    <p class="muted">這一步只能在店裡這台電腦上做。</p>
    <form id="setupForm">
      <label>你的名字</label><input name="name" required>
      <label>登入帳號（英文或數字）</label><input name="login_name" required autocomplete="username">
      <label>密碼（至少 6 個字）</label><input name="password" type="password" required minlength="6" autocomplete="new-password">
      <button>建立並登入</button>
      <div class="err"></div>
    </form>
  </section>

  <section class="card" id="setupRemote" hidden>
    <h2>系統還沒設定</h2>
    <p class="muted">請先在店裡的電腦上打開這個程式，建立老闆帳號。</p>
  </section>

  <section class="card" id="login" hidden>
    <h2>登入</h2>
    <form id="loginForm">
      <label>帳號</label><input name="login_name" required autocomplete="username">
      <label>密碼</label><input name="password" type="password" required autocomplete="current-password">
      <button>登入</button>
      <div class="err"></div>
    </form>
  </section>

  <div id="home" hidden>
    <section class="card">
      <div class="row"><h2 id="hello">你好</h2><button class="secondary" id="logout" style="margin:0">登出</button></div>
      <p class="muted" id="roleNote">後端已經在運作。記單、派單的畫面會在第 3 步加上。</p>
    </section>

    <section class="card" id="phoneCard">
      <h2>📱 手機網址</h2>
      <div id="tunnelStatus" class="muted">讀取中…</div>
      <div id="tunnelUrl" class="url"></div>
      <div id="qr"></div>
      <p class="muted">免費通道每次電腦重開會換網址，手機要重新掃一次。之後買網域就會變成固定網址。</p>
      <p class="muted" id="lan"></p>
    </section>

    <section class="card" id="backupCard">
      <h2>💾 備份</h2>
      <div id="backupInfo" class="muted">讀取中…</div>
      <label>備份資料夾（建議設成 Google 雲端硬碟裡的資料夾）</label>
      <input id="backupDir" placeholder="例如 G:\我的雲端硬碟\瓦斯行備份">
      <div class="row">
        <button id="saveDir">儲存資料夾</button>
        <button class="secondary" id="backupNow">立刻備份一次</button>
      </div>
      <div class="err" id="backupErr"></div>
    </section>
    <p class="muted" id="version"></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const $ = s => document.querySelector(s);
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || ('錯誤 ' + r.status)), { status: r.status });
  return data;
}
function show(id) { ['setup','setupRemote','login','home'].forEach(x => $('#'+x).hidden = x !== id); }
function formData(f) { return Object.fromEntries(new FormData(f)); }

async function start() {
  try { const me = await api('GET', '/api/me'); return home(me); } catch (e) { if (e.status !== 401) console.error(e); }
  const s = await api('GET', '/api/setup');
  if (s.needed) return show(s.local ? 'setup' : 'setupRemote');
  show('login');
}

$('#setupForm').onsubmit = async e => {
  e.preventDefault();
  try { const r = await api('POST', '/api/setup', formData(e.target)); home(r.user); }
  catch (err) { e.target.querySelector('.err').textContent = err.message; }
};
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  try { const r = await api('POST', '/api/login', formData(e.target)); home(r.user); }
  catch (err) { e.target.querySelector('.err').textContent = err.message; }
};
$('#logout').onclick = async () => { await api('POST', '/api/logout').catch(()=>{}); location.reload(); };

let timer;
async function home(me) {
  show('home');
  $('#hello').textContent = '你好，' + me.name;
  const office = me.role !== 'driver';
  $('#phoneCard').hidden = !office;
  $('#backupCard').hidden = me.role !== 'admin';
  if (!office) { $('#roleNote').textContent = '登入成功。收單的畫面會在第 3 步加上。'; return; }
  const settings = await api('GET', '/api/settings').catch(() => ({}));
  $('#backupDir').value = settings.backup_dir || '';
  refresh();
  clearInterval(timer); timer = setInterval(refresh, 5000);
}

let lastUrl = '';
async function refresh() {
  const s = await api('GET', '/api/system').catch(() => null);
  if (!s) return;
  $('#version').textContent = '版本 ' + s.version;
  $('#tunnelStatus').textContent = s.tunnel_status || '';
  $('#tunnelStatus').className = s.tunnel_url ? 'ok' : 'muted';
  $('#tunnelUrl').textContent = s.tunnel_url || '';
  if (s.tunnel_url !== lastUrl) {
    lastUrl = s.tunnel_url;
    $('#qr').innerHTML = '';
    if (s.tunnel_url && window.qrcode) { const q = qrcode(0, 'M'); q.addData(s.tunnel_url); q.make(); $('#qr').innerHTML = q.createSvgTag(5, 0); }
  }
  $('#lan').textContent = s.lan_urls && s.lan_urls.length ? '在店裡 WiFi 也可以用：' + s.lan_urls.join('、') : '';
  const b = s.backup || {};
  $('#backupInfo').innerHTML = b.last_error ? '<span style="color:var(--bad)">上次備份失敗：' + b.last_error + '</span>'
    : (b.last_time ? '上次備份：' + b.last_time + '<br>位置：' + b.dir : '還沒有備份，位置：' + (b.dir || ''));
}

$('#saveDir').onclick = async () => {
  try { await api('PUT', '/api/settings', { backup_dir: $('#backupDir').value.trim() }); $('#backupErr').textContent = ''; refresh(); }
  catch (e) { $('#backupErr').textContent = e.message; }
};
$('#backupNow').onclick = async () => {
  try { await api('POST', '/api/system/backup'); $('#backupErr').textContent = ''; refresh(); }
  catch (e) { $('#backupErr').textContent = '備份失敗：' + e.message; }
};

start();
</script>
</body>
</html>
