name: 打包 Windows 程式

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 檢查資料庫
        run: python3 db/test_schema.py

      - name: 自動測試
        run: go test ./...

      - name: 程式圖示
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd cmd/gas && go-winres make --arch amd64

      - name: 打包 gas.exe
        run: |
          VERSION="$(TZ=Asia/Taipei date +%Y.%m.%d.%H%M)-${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$VERSION" -o dist/gas.exe ./cmd/gas
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/callerid-probe.exe ./cmd/boxprobe
          cp docs/試跑教學.md dist/guide.md
          {
            echo "下載 gas.exe，放到店裡電腦的一個資料夾（例如 C:\\瓦斯行），雙擊執行。教學請看 guide.md。"
            echo
            echo "callerid-probe.exe：來電盒偵測小工具，雙擊後照畫面打一通電話進來，結果會存成文字檔。"
            echo
            echo "version: $VERSION"
            echo
            echo "更新內容："
            git log -8 --pretty='- %s' | grep -v '^- Merge'
          } > dist/notes.md

      - name: 發布到「最新版」下載頁
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版 ${{ env.VERSION }}
          body_path: dist/notes.md
          files: |
            dist/gas.exe
            dist/callerid-probe.exe
            dist/guide.md
          make_latest: true
