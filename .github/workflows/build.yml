name: 打包 Windows 程式

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 檢查資料庫
        run: python3 db/test_schema.py

      - name: 自動測試
        run: go test ./...

      - name: 程式圖示
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd cmd/gas && go-winres make --arch amd64

      - name: 打包 gas.exe
        id: ver
        run: |
          VERSION="$(TZ=Asia/Taipei date +%Y.%m.%d.%H%M)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$VERSION" -o dist/gas.exe ./cmd/gas
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/callerid-probe.exe ./cmd/boxprobe
          cp docs/試跑教學.md dist/guide.md
          {
            echo "第一次安裝：下載 gas-setup.exe 雙擊安裝。已經裝好的電腦：在程式「設定」→「程式更新」按更新即可。"
            echo
            echo "callerid-probe.exe：來電盒偵測小工具，雙擊後照畫面打一通電話進來，結果會存成文字檔。"
            echo
            echo "version: $VERSION"
            echo
            echo "更新內容："
            git log -8 --pretty='- %s' | grep -v '^- Merge'
          } > dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 下載 Cloudflare 通道程式、中文語言檔
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile dist/cloudflared.exe
          try { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseTraditional.isl -OutFile installer/ChineseTraditional.isl } catch { Write-Host "沒有中文語言檔，用英文介面" }

      - name: 編譯安裝檔
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ needs.build.outputs.version }}" installer\gas.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 發布到「最新版」下載頁
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版 ${{ needs.build.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/gas-setup.exe
            dist/gas.exe
            dist/callerid-probe.exe
            dist/guide.md
          make_latest: true
