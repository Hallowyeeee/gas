name: 打包 Windows 程式

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 檢查資料庫
        run: python3 db/test_schema.py

      - name: 自動測試
        run: go test ./...

      - name: 打包 gas.exe
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/gas.exe ./cmd/gas
          cp docs/試跑教學.md dist/

      - name: 發布到「最新版」下載頁
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版
          body: |
            下載 gas.exe，放到店裡電腦的一個資料夾（例如 C:\瓦斯行），雙擊執行。
            教學請看 試跑教學.md。
            版本：${{ github.sha }}
          files: |
            dist/gas.exe
            dist/試跑教學.md
          make_latest: true
