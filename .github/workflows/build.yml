name: 打包 Windows 程式

# 發布規則：
# - 一般分支 push：只跑測試、打包（可在 Actions 頁下載試用），不會上下載頁。
# - 正式發布：在 Actions 手動執行，填版本號 V001、V002…（會自動建立同名標籤）。
#   只由「發布管理」那串在老闆確認後執行。也支援直接 push V 標籤。
on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["V*"]
  workflow_dispatch:
    inputs:
      version:
        description: "正式發布的版本號，例如 V001（留空 = 只測試打包）"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 檢查資料庫
        run: python3 db/test_schema.py

      - name: 自動測試
        run: go test ./...

      - name: 程式圖示
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd cmd/gas && go-winres make --arch amd64

      - name: 打包 gas.exe
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            if ! [[ "$VERSION" =~ ^V[0-9]{3,}$ ]]; then echo "版本號要像 V001"; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then echo "$VERSION 已經發布過了"; exit 1; fi
          elif [[ "$GITHUB_REF" == refs/tags/V* ]]; then
            VERSION="$GITHUB_REF_NAME"
            if ! [[ "$VERSION" =~ ^V[0-9]{3,}$ ]]; then echo "版本標籤要像 V001"; exit 1; fi
          else
            VERSION="test-$(TZ=Asia/Taipei date +%m%d.%H%M)-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$VERSION" -o dist/gas.exe ./cmd/gas
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/callerid-probe.exe ./cmd/boxprobe
          cp docs/試跑教學.md dist/guide.md
          {
            echo "第一次安裝：下載 gas-setup.exe 雙擊安裝。已經裝好的電腦：在程式「設定」→「程式更新」按更新即可。"
            echo
            echo "callerid-probe.exe：來電盒偵測小工具，雙擊後照畫面打一通電話進來，結果會存成文字檔。"
            echo
            echo "version: $VERSION"
            echo
            echo "更新內容："
            if [[ "$VERSION" == V* ]]; then
              # 從 更新日誌.md 取出這一版的段落
              awk -v v="$VERSION" '/^## /{p = ($2 == v)} p && !/^## /' 更新日誌.md
            else
              echo "（測試版，不會上下載頁）"
              git log -8 --pretty='- %s' | grep -v '^- Merge'
            fi
          } > dist/notes.md
          if [[ "$VERSION" == V* ]] && ! grep -q '^## '"$VERSION"'\b' 更新日誌.md; then
            echo "更新日誌.md 裡沒有 ## $VERSION 這一段，先寫好再發布"; exit 1
          fi
          cat dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  installer:
    needs: build
    if: startsWith(needs.build.outputs.version, 'V')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 下載 Cloudflare 通道程式、中文語言檔
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile dist/cloudflared.exe
          try { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseTraditional.isl -OutFile installer/ChineseTraditional.isl } catch { Write-Host "沒有中文語言檔，用英文介面" }

      - name: 編譯安裝檔
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ needs.build.outputs.version }}" installer\gas.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 發布到下載頁
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/gas-setup.exe
            dist/gas.exe
            dist/callerid-probe.exe
            dist/guide.md
          make_latest: true
